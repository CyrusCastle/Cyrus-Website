<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!--    <meta name="theme-color" content="#000000">-->
<!--    <meta name="color-scheme" content="dark">-->

    <title>Cyrus Castle</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">

    <link rel="canonical" href="https://cyruscastle.com/">
    <meta name="description" content="A portfolio website of sorts...">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Cyrus Castle">
    <meta property="og:description" content="A portfolio website of sorts...">
    <meta property="og:url" content="https://cyruscastle.com/">
    <meta property="og:image" content="https://cyruscastle.com/icons/favicon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: #000000;
        }

        #webApp {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            transition: opacity 0.3s ease;
        }

        #loading.done {
            opacity: 0;
            pointer-events: none;
        }

        .loading-track {
            width: 320px;
            max-width: 80vw;
            height: 24px;
            box-sizing: border-box;
            padding: 3px;
            /* background: #ffffff; */
            /* border-top: 2px solid #808080; */
            /* border-left: 2px solid #808080; */
            /* border-bottom: 2px solid #ffffff; */
            /* border-right: 2px solid #ffffff; */
        }

        .loading-fill {
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                to right,
                #33FF33 0px,
                #33FF33 14px,
                transparent 14px,
                transparent 18px
            );
            background-size: 18px 100%;
            animation: chunk-scroll 0.6s linear infinite;
        }

        @keyframes chunk-scroll {
            from { background-position-x: 0; }
            to   { background-position-x: 18px; }
        }
    </style>
</head>

<body>
<div id="webApp"></div>

<div id="loading">
    <div class="loading-track">
        <div class="loading-fill"></div>
    </div>
</div>

<script>
    (function () {
        var host = document.getElementById("webApp");
        var loader = document.getElementById("loading");

        var isMobile = window.matchMedia("(pointer: coarse) and (max-width: 900px)").matches;

        // Drop the loader once Compose has attached its canvas and drawn a frame.
        new MutationObserver(function (mutations, observer) {
            if (!host.querySelector("canvas")) return;
            observer.disconnect();
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    loader.classList.add("done");
                    setTimeout(function () { loader.remove(); }, 300);
                });
            });
        }).observe(host, { childList: true, subtree: true });

        var script = document.createElement("script");
        script.src = isMobile ? "mobileApp.js" : "desktopApp.js";
        script.onerror = function () {
            loader.innerHTML =
                '<p style="color:#33FF33;font-family:monospace">Failed to load. Try refreshing.</p>';
        };
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
